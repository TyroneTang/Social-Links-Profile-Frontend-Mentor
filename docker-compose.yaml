version: '3.8'

services:
  devcontainer_node:
    container_name: devcontainer_node_social_links_profile
    image: devcontainer_node:latest   
    working_dir: /root/workspace
    network_mode: "host"
    ipc: host
    tty: true
    stdin_open: true
    privileged: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - ALL
    volumes:
      - $PWD/:/root/workspace
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates
      - /etc/ssl/certs:/etc/ssl/certs
      - $HOME/.bashrc:/root/.bashrc
      - $HOME/.gitconfig:/root/.gitconfig
      - $HOME/.ssh:/root/.ssh:ro